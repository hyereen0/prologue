<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROLOGUE MANAGEMENT</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #111; }
  .hero { position: relative; width: 100%; height: 100vh; min-height: 560px; overflow: hidden; color: #fff; }

  .panel { position: absolute; top: 0; bottom: 0; background-size: cover; background-repeat: no-repeat; }
  .panel.left   { left: 0;   width: 40%; background-image: url("moon1.jpg"); background-position: center top;
                  clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%); z-index: 1; }
  .panel.center { left: 30%; width: 40%; background-image: url("cheon1.jpg"); background-position: center top;
                  clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); z-index: 2; }
  .panel.right  { right: 0;  width: 40%; background-image: url("shin1.jpg"); background-position: center top;
                  clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%); z-index: 1; }
  .panel.center { left: 30%; }
  .hero::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
                 background: linear-gradient(to top, rgba(0,0,0,.65) 0%, rgba(0,0,0,0) 45%); }

  header { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between;
           align-items: flex-start; padding: 20px 40px; }
  header .logo img { height: 90px; display: block; }
  nav { display: flex; align-items: center; gap: 36px; padding-top: 22px; }
  nav a { color: #222; text-decoration: none; font-family: "Cinzel", serif; font-size: 12px; letter-spacing: .15em; }
  .menu { width: 26px; height: 10px; border-top: 1px solid #222; border-bottom: 1px solid #222; margin-left: 12px; }

  .title { position: absolute; z-index: 10; left: 0; right: 0; bottom: 8%; text-align: center; }
  .title h1 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: clamp(48px, 9vw, 120px);
              letter-spacing: .25em; padding-left: .25em; line-height: 1; }
  .title h2 { font-family: "Cinzel", serif; font-weight: 400; font-size: clamp(16px, 2.4vw, 32px);
              letter-spacing: .4em; padding-left: .4em; margin-top: 14px; }
  .title p  { font-family: "Cinzel", serif; font-size: clamp(10px, 1.1vw, 14px); letter-spacing: .4em; margin-top: 26px; }
  .scroll { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 20px;
            font-family: "Cinzel", serif; font-size: 10px; letter-spacing: .2em; }
  .scroll::before { content: ""; width: 1px; height: 28px; background: #fff; }

  @media (max-width: 700px) {
    header { padding: 14px 18px; }
    header .logo img { height: 60px; }
    nav a { display: none; }
  }
</style>
</head>
<body>
<section class="hero">
  <div class="panel left"></div>
  <div class="panel center"></div>
  <div class="panel right"></div>

  <header>
    <a class="logo" href="#"><img src="main logo.png" alt="Prologue Management"></a>
    <nav>
      <a href="#artists">ARTISTS</a>
      <a href="#about">ABOUT</a>
      <a href="#works">WORKS</a>
      <a href="#contact">CONTACT</a>
      <span class="menu"></span>
    </nav>
  </header>

  <div class="title">
    <h1>PROLOGUE</h1>
    <h2>MANAGEMENT</h2>
    <p>THE STORY BEGINS HERE.</p>
    <div class="scroll">SCROLL</div>
  </div>
</section>
</body>
</html>
